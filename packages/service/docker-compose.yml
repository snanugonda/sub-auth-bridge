services:
  hub:
    build: .
    container_name: hub
    ports:
      - "8787:8787"
    volumes:
      # Only the auth dir is bind-mounted — not the whole home directory.
      # Read-write: token refresh writes the new access/refresh token back here.
      - ${HOME}/.open-ai-sub-auth:/data/auth
    environment:
      - OPEN_AI_SUB_AUTH_DIR=/data/auth
    # To let another container reach this one by name instead of a host
    # port, join the shared network (repo.sh's equivalent joins this same
    # network — my-hub-net — by default; see packages/service/CLAUDE.md):
    # networks:
    #   - my-hub-net
# networks:
#   my-hub-net:
#     external: true
