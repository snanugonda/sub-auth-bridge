services:
  hub:
    build: .
    image: hub
    container_name: hub
    ports:
      - "8787:8787"
    volumes:
      # Only the auth dir is bind-mounted — not the whole home directory.
      # Read-write: token refresh writes the new access/refresh token back here.
      - ${HOME}/.open-ai-sub-auth:/data/auth
    environment:
      - OPEN_AI_SUB_AUTH_DIR=/data/auth
    # Joins the same network repo.sh's `start docker` uses by default, so
    # another container can reach this one as http://hub:8787 instead of a
    # host port (see packages/service/CLAUDE.md). external: true because
    # either this or repo.sh may create it first — external avoids the two
    # tools fighting over network ownership. If neither has run yet:
    #   docker network create my-hub-net
    networks:
      - my-hub-net

networks:
  my-hub-net:
    external: true
